name: Release

# Fires when a PR targeting main is merged AND has the 'release' label.
# To skip a release: simply don't add the label before merging.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write   # needed to create tags and GitHub Releases

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so --generate-notes covers all changes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build backend
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/* \
            --title "forge-utils v${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
