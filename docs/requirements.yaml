metadata:
  project: forge
  version: 0.1.0
  description: >
    forge-utils is a personal dev-toolkit for code quality grading and project
    scaffolding. It measures health (test coverage, complexity, dependency CVEs,
    requirements coverage, static analysis, type coverage, dead code, mutation
    testing) and surfaces a weighted grade. It does not enforce FDA-level
    compliance; that is the responsibility of regulatory_tools.

requirements:

  # ==============================
  # System-Level Requirements
  # ==============================

  - id: SYS-001
    title: Project Health Report Contract
    description: >
      The library shall produce a ProjectHealthReport for any given local
      project path. The report shall include: project name, path, timestamp,
      per-collector results, and an overall health score (0.0–1.0).

  - id: SYS-002
    title: Graceful Degradation
    description: >
      If a collector cannot run (missing tool, no tests found, etc.) it shall
      return a result with score=None and a human-readable reason. The overall
      score shall be computed from available collectors only.

  # ==============================
  # Collector Requirements
  # ==============================

  - id: COL-001
    title: Test Metrics Collector
    description: >
      The library shall collect test metrics by running pytest with coverage.py
      on the target project. It shall report: total tests, passed, failed,
      skipped, pass rate (0–1), and line coverage percentage.

  - id: COL-002
    title: Code Complexity Collector
    description: >
      The library shall analyse code complexity using radon. It shall report:
      average cyclomatic complexity, maintainability index, and a normalised
      score (0–1) where higher = simpler/better.

  - id: COL-003
    title: Dependency Health Collector
    description: >
      The library shall audit dependencies using pip-audit. It shall report:
      total dependencies audited, number with known CVEs, and a normalised
      score (0–1).

  - id: COL-004
    title: Requirements Coverage Collector
    description: >
      The library shall scan source and test files for requirement tags. It
      shall report: total unique requirements found, how many are referenced
      in tests, and a coverage ratio (0–1). Preferred mode reads IDs from a
      machine-readable requirements.yaml; regex fallback scans source tags.

  - id: COL-005
    title: Weighted Health Score
    description: >
      The overall health score shall be a weighted average of all collector
      scores. Weights shall be configurable via forge.toml per project.
      Default weights: test_metrics=0.30, complexity=0.15,
      dependency_health=0.20, requirements_coverage=0.10,
      static_analysis=0.10, type_coverage=0.10, dead_code=0.05,
      mutation_testing=0.00.

  - id: COL-006
    title: Static Analysis Collector
    description: >
      The library shall analyse source code using ruff (preferred) or flake8
      (fallback). It shall bucket violations by fix applicability: safe
      (auto-fixable, no behavior change), unsafe (auto-fixable, may change
      behavior), and manual (no fix available). The score shall use a weighted
      density formula (safe=0.3×, unsafe=0.7×, manual=1.0×) against a ceiling
      of 50 weighted errors per 1000 lines, so formatting noise penalises the
      score less than genuine logic issues. When using the flake8 fallback, all
      errors are counted as manual.

  - id: COL-007
    title: Type Coverage Collector
    description: >
      The library shall check type annotations using mypy. It shall report:
      total type errors, files checked, and a normalised score (0–1) where
      0 errors = 1.0 and 100+ errors = 0.0.

  - id: COL-008
    title: Dead Code Collector
    description: >
      The library shall detect unused code using vulture at ≥80% confidence.
      It shall report: unused item count, total Python lines, unused density
      (items per 1000 lines), and a normalised score (0–1).

  - id: COL-009
    title: Mutation Testing Collector
    description: >
      When enabled, the library shall compute a mutation score using mutmut.
      It shall report: total mutants generated, killed mutants, and mutation
      score (killed / total, 0–1).

  - id: COL-010
    title: Mutation Testing Opt-In
    description: >
      Mutation testing shall be disabled by default due to its long runtime.
      It shall be enabled per-project via forge.toml:
      [collectors.mutation_testing] enabled = true.

  # ==============================
  # Infrastructure Requirements
  # ==============================

  - id: INF-001
    title: forge.toml Configuration
    description: >
      Each project may include a forge.toml file. If absent, defaults shall
      be used. The config shall support: custom weights, score thresholds,
      and requirements tag pattern.

  # ==============================
  # CLI Requirements
  # ==============================

  - id: CLI-001
    title: forge health Command
    description: >
      The CLI shall provide a forge health <path> command that runs all
      collectors and prints a formatted summary to stdout. An --output flag
      shall write the full report to a JSON file.

  - id: CLI-002
    title: forge new Command
    description: >
      The CLI shall provide a forge new <name> command that creates a new
      project with: standard folder structure (src, tests, docs),
      environment.yaml, pyproject.toml, forge.toml, .gitignore, README.md,
      and a passing starter test.

  - id: CLI-003
    title: Health Run Artifacts
    description: >
      When invoked with --save-artifact, forge health shall write the full
      JSON report to <project_path>/artifacts/health_runs/<YYYYMMDD_HHMMSS_ffffff>/
      health_report.json, creating parent directories as needed. Each
      invocation shall produce a unique timestamped directory, preserving
      the full history of health runs for audit purposes.

  # ==============================
  # Workspace Requirements
  # ==============================

  - id: WRK-001
    title: Workspace Status Models
    description: >
      The library shall provide BranchProtectionStatus, RulesetStatus,
      RepoStatus, and WorkspaceStatusReport Pydantic models representing
      the observed state of a multi-repo workspace. WorkspaceStatusReport
      shall expose computed fields total_repos and repos_with_issues.

  - id: WRK-002
    title: Workspace Collector
    description: >
      The library shall provide a WorkspaceCollector that, given a
      WorkspaceConfig, queries the GitHub API via the gh CLI and reads local
      files to populate a WorkspaceStatusReport. It shall collect: repo
      settings, classic branch protection, rulesets, local workflow files,
      CODEOWNERS, dependabot.yml, current git branch, and last CI conclusion.
      It shall degrade gracefully when gh is unavailable or API calls fail.
      It shall implement a deterministic _compute_issues rule engine. When
      run_health=True, it shall invoke forge health --json for each repo with
      a configured local_path.

  - id: WRK-003
    title: forge workspace Command
    description: >
      The CLI shall expose a forge workspace <config> command that loads a
      workspace.toml, runs WorkspaceCollector.collect_all(), and renders the
      WorkspaceStatusReport using WorkspaceReporter. It shall support:
      --markdown (print markdown to stdout), --output <path> (write markdown
      to file), and --no-health (skip forge health collection). Health runs
      by default. It shall exit 1 if the config file is not found.

  - id: WRK-004
    title: Environment Discovery
    description: >
      The library shall provide an EnvDiscovery module that enumerates
      available Python environments: a project-local .venv (if present) and
      all conda environments returned by "conda env list --json". Each result
      shall expose a human-readable name and the absolute path to the python
      binary. Discovery shall degrade gracefully when conda is not available.

  # ==============================
  # VS Code Extension Requirements
  # ==============================

  - id: EXT-001
    title: VS Code Extension Sub-Library
    description: >
      The forge repository shall include a forge-vscode-panel/ sub-library
      containing the VS Code extension source, package.json with @vscode/vsce
      packaging scripts, an MIT LICENSE, and a .vscodeignore that excludes
      node_modules from the bundle.
    rationale: >
      Co-locating the extension with the forge CLI enables atomic changes,
      shared version history, and consistent release tooling.
    verification: >
      npm run package in forge-vscode-panel/ produces a .vsix with no warnings
      containing only src/, package.json, and LICENSE.txt.

  - id: EXT-002
    title: VS Code Panel CI Validation
    description: >
      The CI system shall validate that the VS Code extension packages cleanly
      (npm install && vsce package succeeds) on every pull request that touches
      forge-vscode-panel/ files. The built .vsix shall be uploaded as a
      downloadable workflow artifact for PR review.
    rationale: >
      Catches broken packaging before merge, preventing a broken release.
    verification: >
      ci-panel.yml GitHub Actions workflow passes and uploads a .vsix artifact
      on a PR touching forge-vscode-panel/.

  - id: EXT-003
    title: Automated VS Code Panel Release
    description: >
      Whenever a pull request touching forge-vscode-panel/ is merged into main,
      the CI system shall automatically build a .vsix and publish a GitHub
      Release tagged vscode-panel-vX.Y.Z with the .vsix attached. No label
      gate is required; the version is read from package.json.
    rationale: >
      Eliminates manual release steps; every merged panel PR is automatically
      shippable.
    verification: >
      Merging a panel PR to main triggers release-vscode-panel.yml and creates
      a GitHub Release with the correct tag and .vsix asset.

  - id: EXT-004
    title: VS Code Panel Repository Overview Table
    description: >
      The VS Code panel shall always display a "Repository Overview" table at
      the top of the dashboard (both Mode A — VS Code workspace folders — and
      Mode B — workspace.toml). For each repo the table shall show: name, health
      grade (A–F colour-coded badge), current local branch (truncated at 18
      characters), commits ahead/behind its upstream (↑N ↓M, or ✓ if in sync,
      or — if no upstream is tracked), open PR number as a clickable GitHub link
      (or — if none), and CI check-run pass count out of total (N/M,
      colour-coded green/yellow/red, or — if data is unavailable).
    rationale: >
      A single at-a-glance row per repo gives the user immediate workspace
      health and branch context without scrolling through individual health
      cards.
    verification: >
      Open VS Code with one or more workspace folders; the panel's Repository
      Overview section shows the correct columns (Repo, Grade, Br, ±, PR, CI)
      and populates branch/ahead-behind from git and PR/CI data from the GitHub
      API for each repo. Unit tests cover _buildRepoOverview with mock data.

  - id: EXT-005
    title: VS Code Panel Git Sync Button and Context Menu
    description: >
      The VS Code panel shall provide (a) a "Sync" button in the toolbar that
      runs `forge gitsync <path>` for each workspace repo in a dedicated "Forge"
      VS Code terminal, and (b) a right-click context menu on each repo row in
      the Repository Overview table with a "Git Sync" option that runs
      `forge gitsync <repo_path>` for that single repo in the same terminal.
      The terminal shall be reused if already open.
    rationale: >
      One-click multi-repo sync and stale-branch cleanup without leaving the editor.
    verification: >
      Clicking "Sync All" opens/reuses a "Forge" terminal and runs forge gitsync
      for all repos. Right-clicking a repo row shows a context menu; "Git Sync"
      runs forge gitsync for that single repo. Unit tests cover data-repo-path
      and data-repo-name attributes on overview table rows.

  - id: WRK-005
    title: forge dashboard Command
    description: >
      The CLI shall expose a forge dashboard [path] command that presents an
      interactive numbered menu of available Python environments (via
      EnvDiscovery), runs forge health on the selected project path using the
      chosen interpreter, and renders the ProjectHealthReport to the terminal.
      It shall support --env <name|path> to skip the interactive picker and
      --output <path> to write the JSON report to a file. The default
      highlighted entry shall be the interpreter configured in forge.toml
      [test_runner] python when present.

  # ==============================
  # Git Sync Requirements
  # ==============================

  - id: GIT-001
    title: Repository Discovery
    description: >
      forge gitsync shall accept a path argument. If the path itself contains
      a .git/ directory it is treated as a single repository. Otherwise, all
      immediate subdirectories that contain .git/ are treated as repositories.
      If no repositories are found the command shall exit 1 with a clear message.
    rationale: Supports single-repo and multi-repo (workspace) usage without separate flags.
    verification: Unit tests covering single-repo path, directory-of-repos path, and empty directory.

  - id: GIT-002
    title: Remote Fetch and Prune
    description: >
      For each discovered repository forge gitsync shall run `git fetch --prune`,
      updating remote tracking refs and removing refs for remote branches that
      no longer exist. A fetch failure shall be recorded as an error for that
      repo; remaining repos shall still be processed.
    rationale: Prune is necessary before gone-branch detection is accurate.
    verification: Unit test mocking fetch failure confirms error is captured and other repos continue.

  - id: GIT-003
    title: Landing Branch Checkout and Pull
    description: >
      For each repo, forge gitsync shall detect the landing branch (`dev` if it
      exists locally or as origin/dev, otherwise `main`), checkout that branch,
      and pull from origin. This checkout happens before stale branch cleanup
      (GIT-004), ensuring the user is never left on a branch that is about to
      be deleted. A checkout or pull failure shall be recorded as an error for
      that repo without aborting the run.
    rationale: Keeps the canonical integration branch up to date and guarantees the working branch is safe before cleanup.
    verification: Unit tests verify dev is preferred over main; pull failure is captured as error; checkout precedes any branch deletion.

  - id: GIT-004
    title: Stale Branch Cleanup
    description: >
      After fetching (GIT-002) and switching to the landing branch (GIT-003),
      forge gitsync shall identify local branches whose remote tracking ref is
      marked `[gone]` in `git branch -vv`. For each such branch it shall first
      check whether all commits are present in origin/<landing>
      (`git log origin/<landing>...<branch>` is empty). If so, the branch is
      deleted locally (`git branch -D`). If git log reports commits not in
      origin/<landing> (as occurs with squash-merged PRs where individual commits
      are not in the ancestry), the tool shall additionally run
      `git diff origin/<landing> <branch>` to compare working-tree content. If
      that diff is also empty, the branch's changes are fully incorporated and
      the branch shall be deleted. Only if both checks are non-empty (git log
      shows unique commits AND the content diff is non-empty) shall the branch
      be left untouched and the user notified in the summary. `main` and `dev` shall
      never be deleted regardless of their remote tracking state. Because GIT-003
      runs first, the currently-checked-out branch will always be the landing
      branch by the time this step runs, so the previously-active stale branch
      can be deleted without a "cannot delete current branch" error.
    rationale: >
      Automates cleanup of squash-merged and otherwise closed branches. The
      GIT-003 ordering ensures the user lands on dev/main when their working
      branch is stale.
    verification: >
      Unit tests cover: delete when no unpushed commits; skip + notify when
      unpushed commits exist; never delete main or dev; currently-checked-out
      stale branch is deleted after GIT-003 checkout.
